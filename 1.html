<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Grid Example</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>
<div class="container">
    <div class="header">
            <h2>Don Mariano Marcos Memorial State University</h2>
            <img src="DMMMSU-Logo-white-small.png" alt="Cruz" width="60" height="60" style="position: absolute; top: 25px; left: 23px;">
    </div>
    <div class="header1">
        <h3>HOME ABOUT CONTACT US</h3>
        </div>
    <div class="menu">
        <h1>Campus Notices</h1>

<div class="gallery">
    <div class="gallery-item">
        <img src="sluc.jpg" alt="Sluc">
        <div class="desc">Sluc</div>
    </div>

    <div class="gallery-item">
        <img src="forest.jpg" alt="Green Forest">
        <div class="desc">Green Forest</div>
    </div>

    <div class="gallery-item">
        <img src="library.jpg" alt="University Library">
        <div class="desc">University Library</div>
    </div>
    </div>
    </div>
    <div class="content">
        <label for="Title"><h3>Title</h3></label>
        <input type="Title" id="Title" name="Title">
        <label for="Message"><h3>Message</h3></label>
        <input type="Message" id="Message" name="Message">
        <button type="Post Notice" style=" color: Yellow;">Post Notice</button><br></br>
    </div>
    <div class="footer"><h4>College Of Computer Science</h4></div>
    </div>
</div>
</body>
</html>
